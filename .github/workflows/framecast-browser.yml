name: "FrameCast in the browser"

# Publishes apps/browser to GitHub Pages. Only the files the app needs are
# copied into the site; PRODUCT.md and the .impeccable design notes stay out.

on:
  push:
    branches: [framecast]
    paths: ["apps/browser/**", ".github/workflows/framecast-browser.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: framecast-browser-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cd apps/browser
          cp -r index.html styles.css sw.js manifest.webmanifest favicon.ico js fonts icons sounds ../../_site/
          touch ../../_site/.nojekyll
          ls -R ../../_site | head -50

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
